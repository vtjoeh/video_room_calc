<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ - Video Room Calculator</title>
    <link rel="icon" href="./assets/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="./assets/momentum-tokens.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="documentation">

    <div id="loading">Loading...</div>
    <div id="error"></div>
    <div id="content"></div>

    <script>
        fetch('./FAQ.md')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load FAQ.md');
                }
                return response.text();
            })
            .then(markdown => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').innerHTML = marked.parse(markdown);
                addHeaderAnchors();
                scrollToAnchor();
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Error loading FAQ: ' + error.message;
            });

        function addHeaderAnchors() {
            const headers = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4, #content h5, #content h6');
            headers.forEach(header => {
                const text = header.textContent;
                const id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                header.id = id;

                const anchor = document.createElement('a');
                anchor.className = 'header-anchor';
                anchor.href = '#' + id;
                anchor.innerHTML = '¶';
                anchor.onclick = (e) => {
                    e.preventDefault();
                    const url = window.location.origin + window.location.pathname + '#' + id;
                    navigator.clipboard.writeText(url).then(() => {
                        showCopyFeedback();
                    });
                };
                header.appendChild(anchor);
            });
        }

        function showCopyFeedback() {
            let feedback = document.querySelector('.copy-feedback');
            if (!feedback) {
                feedback = document.createElement('div');
                feedback.className = 'copy-feedback';
                feedback.textContent = 'Link copied to clipboard!';
                document.body.appendChild(feedback);
            }
            feedback.style.display = 'block';
            setTimeout(() => {
                feedback.style.display = 'none';
            }, 2000);
        }

        function scrollToAnchor() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                const element = document.getElementById(hash);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            }
        }
    </script>
</body>
</html>
