<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Notes - Video Room Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        h1 {
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        h2 {
            margin-top: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        code {
            background-color: #f4f4f4;
            padding: 2px 5px;
            border-radius: 3px;
        }
        pre {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        a {
            color: #0066cc;
        }
        #content {
            margin-top: 20px;
        }
        #error {
            color: red;
            display: none;
        }
        #loading {
            color: #666;
        }
        .header-anchor {
            color: #999;
            text-decoration: none;
            margin-left: 8px;
            opacity: 0;
            transition: opacity 0.2s;
            cursor: pointer;
        }
        h1:hover .header-anchor,
        h2:hover .header-anchor,
        h3:hover .header-anchor,
        h4:hover .header-anchor,
        h5:hover .header-anchor,
        h6:hover .header-anchor {
            opacity: 1;
        }
        .header-anchor:hover {
            color: #0066cc;
        }
        .copy-feedback {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="loading">Loading...</div>
    <div id="error"></div>
    <div id="content"></div>

    <script>
        fetch('./RELEASE_NOTES.md')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load RELEASE_NOTES.md');
                }
                return response.text();
            })
            .then(markdown => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').innerHTML = marked.parse(markdown);
                openContentLinksInNewTab();
                addHeaderAnchors();
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Error loading release notes: ' + error.message;
            });

        /* Release Notes render inside an iframe modal; markdown-authored links must escape it into a new tab rather than navigating the iframe. Runs before addHeaderAnchors() so it doesn't touch the pilcrow copy-link anchors. */
        function openContentLinksInNewTab() {
            document.querySelectorAll('#content a[href]').forEach(link => {
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
            });
        }

        function addHeaderAnchors() {
            const headers = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4, #content h5, #content h6');
            headers.forEach(header => {
                const text = header.textContent;
                const id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                header.id = id;

                const anchor = document.createElement('a');
                anchor.className = 'header-anchor';
                anchor.href = '#' + id;
                anchor.innerHTML = '¶';
                anchor.onclick = (e) => {
                    e.preventDefault();
                    const url = window.location.origin + window.location.pathname + '#' + id;
                    navigator.clipboard.writeText(url).then(() => {
                        showCopyFeedback();
                    });
                };
                header.appendChild(anchor);
            });
        }

        function showCopyFeedback() {
            let feedback = document.querySelector('.copy-feedback');
            if (!feedback) {
                feedback = document.createElement('div');
                feedback.className = 'copy-feedback';
                feedback.textContent = 'Link copied to clipboard!';
                document.body.appendChild(feedback);
            }
            feedback.style.display = 'block';
            setTimeout(() => {
                feedback.style.display = 'none';
            }, 2000);
        }
    </script>
</body>
</html>
